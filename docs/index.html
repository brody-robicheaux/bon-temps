<style>
:root {
  /* Acadiana flag: flag blue, festival red, gold */
  --bg: #FAF8F3; --surface: #FFFFFF; --surface-2: #EEEBE3; --ink: #1B2433; --ink-2: #5C6575; --line: #E4E0D6;
  --brand: #1F5BA6; --brand-ink: #FFFFFF; --accent: #C62F3E; --gold: #F4B41A;
  --music: #B02936; --theater: #B0357A; --food: #8F5B00; --arts: #6B4FA0; --wellness: #1D7652; --family: #1A6F92; --civic: #A44A24; --sports: #0B6A6E; --community: #5C6575;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 14px rgba(20,30,50,.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1726; --surface: #172238; --surface-2: #1E2B44; --ink: #EEF2F8; --ink-2: #A3AEC2; --line: #2A3A57;
    --brand: #7AAAF0; --brand-ink: #0F1726; --accent: #FF6B78; --gold: #F4B41A;
    --music: #FF6B78; --theater: #F08BC0; --food: #F4B41A; --arts: #B794DB; --wellness: #5CC79A; --family: #6BC6E0; --civic: #F59A6B; --sports: #4FC3C7; --community: #A3AEC2;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1726; --surface: #172238; --surface-2: #1E2B44; --ink: #EEF2F8; --ink-2: #A3AEC2; --line: #2A3A57;
  --brand: #7AAAF0; --brand-ink: #0F1726; --accent: #FF6B78; --gold: #F4B41A;
  --music: #FF6B78; --theater: #F08BC0; --food: #F4B41A; --arts: #B794DB; --wellness: #5CC79A; --family: #6BC6E0; --civic: #F59A6B; --sports: #4FC3C7; --community: #A3AEC2;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* header */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; align-items: center; gap: 8px; padding: 14px 0 12px; }
.logo { display: flex; align-items: center; gap: 11px; text-decoration: none; flex: 1; min-width: 0; }
.logo img { flex: none; width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }
.logo b { display: block; font-size: 22px; white-space: nowrap; line-height: 1.1; letter-spacing: -.01em; color: var(--brand); font-weight: 800; }
.logo b, .day, .sheet h2, .venuebar b, footer h4, .tip b { font-family: Fraunces, Georgia, "Times New Roman", serif; }
.day { font-weight: 700; font-size: 16.5px; letter-spacing: .005em; }
.logo span { min-width: 0; }
.logo small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { position: relative; flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; color: var(--ink-2); }
.iconbtn[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.iconbtn .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.iconbtn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.search { position: relative; display: block; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px 11px 40px; font-size: 16px; outline: none; -webkit-appearance: none; }
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
.filters { display: grid; gap: 10px; padding: 12px 0 12px; }
/* when: one even segmented control */
/* when: one swipeable strip of ranges and days */
.strip { position: relative; display: flex; gap: 6px; align-items: stretch; overflow-x: auto; padding: 0 16px; margin: 0 -16px; scrollbar-width: none; scroll-behavior: smooth; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent); }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: none; border: 0; background: var(--surface-2); color: var(--ink-2); border-radius: 12px; font-size: 13.5px; font-weight: 650; padding: 0 13px; min-height: 48px; white-space: nowrap; }
.strip .tile { width: 50px; padding: 6px 0; text-align: center; line-height: 1.15; }
.strip .tile small { display: block; font-size: 11px; font-weight: 650; letter-spacing: .02em; }
.strip .tile b { display: block; font-size: 18px; font-weight: 750; color: var(--ink); }
.strip .tile.none { opacity: .4; }
.strip .tile { position: relative; }
.strip .tile .hol { position: absolute; top: 3px; right: 3px; font-size: 10.5px; font-style: normal; line-height: 1; }
.strip .tile.none .hol { opacity: 1; }
.day .holname { margin-left: auto; font-size: 12.5px; font-weight: 650; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.strip button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.strip button[aria-pressed="true"] b { color: var(--brand-ink); }
.strip .gap { flex: none; width: 1px; background: var(--line); margin: 8px 2px; }
/* categories: one quiet scrolling row */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; margin: 0 -16px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: none; border-radius: 999px; padding: 6px 11px; min-height: 38px; font-size: 14px; font-weight: 550; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--brand)) 14%, transparent); color: var(--c, var(--brand)); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip.sep { margin-left: 4px; box-shadow: inset 1px 0 0 var(--line); border-radius: 0 999px 999px 0; padding-left: 14px; }
.savedbar { display: flex; justify-content: space-between; align-items: center; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--ink); border-radius: 11px; padding: 9px 12px; font-weight: 600; font-size: 14px; }
.savedbar button { border: 0; background: none; color: var(--accent); font-weight: 650; }
.savedbar.searchbar { margin: 10px 0 4px; }
.card.over { box-shadow: none; border-style: dashed; }
.card.over h3, .card.over .when { color: var(--ink-2); }
.card.over .save { opacity: .7; }
.picks { margin: 12px -16px 2px; }
.phead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px; }
.phead h2 { font-family: Fraunces, Georgia, serif; font-size: 18px; margin: 0; }
.phead .swipehint { color: var(--ink-2); font-size: 13px; }
.prow { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 16px 12px; scrollbar-width: none; }
.prow::-webkit-scrollbar { display: none; }
.prow .pcard { flex: 0 0 68%; align-items: stretch; margin: 0; width: auto; grid-template-columns: none; gap: 0; max-width: 250px; scroll-snap-align: start; display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; color: var(--ink); font: inherit; }
.prow .pcard::before { display: none; }
.pcard .ph { position: relative; display: block; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; }
.pcard .ph img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.pcard .poster { display: none; }
.pcard.noimg .poster { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 12px 64px 12px 12px; background: #F1E4C8; overflow: hidden; }
.pcard .poster img { position: absolute; right: -34px; top: -10px; width: 120px; height: 120px; transform: rotate(9deg); border-radius: 16px; }
.pcard .poster i { align-self: flex-start; font-style: normal; background: #C62F3E; color: #F1E4C8; font: 700 10.5px/1 Oswald, "Segoe UI", sans-serif; letter-spacing: .18em; text-transform: uppercase; padding: 4px 7px; transform: rotate(-2deg); }
.pcard .poster b { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 19px; line-height: 1.1; color: #1F4F96; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard.noimg .ptx b { display: none; }  /* the name is already on the poster */
.pcard .pwhen { position: absolute; left: 8px; top: 8px; background: rgba(16,19,26,.78); color: #fff; font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.pcard .ptx { display: block; padding: 9px 11px 11px; }
.pcard .ptx b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 1.25; }
.pcard .ptx small { display: block; margin-top: 3px; color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sharelist { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px auto 4px; border: 1px solid var(--line); background: var(--surface); color: var(--brand); border-radius: 999px; padding: 9px 16px; font-weight: 650; font-size: 14px; }
main.slide-l { animation: slideL .22s ease-out; } main.slide-r { animation: slideR .22s ease-out; }
@keyframes slideL { from { opacity: .3; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: .3; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { main.slide-l, main.slide-r { animation: none; } }
.fix { margin-top: 14px; text-align: center; }
.fix > button { border: 0; background: none; color: var(--ink-2); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.fixform { text-align: left; margin-top: 6px; }
.fixform textarea { width: 100%; min-height: 84px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px; font: inherit; font-size: 15px; resize: vertical; box-sizing: border-box; }
.fixform .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.fixform .row button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.fixform .row .go { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.card.over::before { background: var(--line); }
:where(button, a, summary, [role=button]):focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 10px; }
.ended { font-weight: 650; color: var(--ink-2); }
.venuebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--ink); border-radius: 11px; padding: 10px 12px; font-size: 14px; margin-top: 4px; }
.venuebar b { display: block; font-size: 15.5px; }
.venuebar small { color: var(--ink-2); }
.venuebar button { flex: none; border: 0; background: none; color: var(--brand); font-weight: 650; }
.venuelink { display: inline-block; margin-top: 4px; border: 0; background: none; padding: 0; color: var(--brand); font-weight: 650; font-size: 14px; }
.tip { position: relative; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 40px 12px 12px; margin: 10px 0 2px; box-shadow: var(--shadow); font-size: 14px; }
.tip img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.tip b { display: block; font-size: 15px; margin-bottom: 2px; }
.tip p { margin: 0; color: var(--ink-2); }
.tip .share { display: inline-block; vertical-align: -3px; }
.tip .install { margin-top: 8px; border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 7px 14px; font-weight: 650; }
.tip .x { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: var(--ink-2); font-size: 20px; width: 30px; height: 30px; border-radius: 50%; }

/* list */
main { padding: 6px 0 40px; }
.day { position: sticky; top: var(--head-h, 170px); z-index: 5; background: var(--bg); padding: 14px 0 6px; font-weight: 750; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
.day span { color: var(--ink-2); font-weight: 500; font-size: 13.5px; }
.card { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 0; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden; text-align: left; width: 100%; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--community)); }
.card:hover { border-color: color-mix(in srgb, var(--c, var(--line)) 50%, var(--line)); }
.card:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 40%, transparent); }
.when { text-align: right; font-weight: 700; font-size: 14px; padding-left: 8px; line-height: 1.2; }
.when small { display: block; color: var(--ink-2); font-weight: 500; font-size: 12px; margin-top: 2px; }
.info { min-width: 0; }
.info h3 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 650; }
.meta { color: var(--ink-2); font-size: 13.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c); font-weight: 600; }
.tag.free { --c: var(--wellness); }
.save { border: 0; background: none; padding: 11px; margin: -8px -6px 0 0; color: var(--ink-2); border-radius: 8px; }
.save[aria-pressed="true"] { color: var(--accent); }
.empty { text-align: center; color: var(--ink-2); padding: 48px 12px; }
.more { display: block; margin: 16px auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 20px; }
details.allday { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; margin: 2px 0 10px; font-size: 14px; }
details.allday summary { cursor: pointer; color: var(--ink-2); list-style: none; display: flex; gap: 6px; align-items: baseline; }
details.allday summary::-webkit-details-marker { display: none; }
details.allday summary b { color: var(--ink); flex: none; }
details.allday summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.allday summary::after { content: "▾"; margin-left: auto; flex: none; }
details.allday[open] summary::after { content: "▴"; }
details.allday .card { margin-top: 8px; }
details.ongoing { background: var(--surface-2); border-radius: var(--radius); padding: 10px 14px; margin: 10px 0 4px; }
details.ongoing summary { cursor: pointer; font-weight: 650; font-size: 15px; }
details.ongoing .card { margin-top: 8px; }

/* footer */
footer { border-top: 1px solid var(--line); padding: 22px 0 calc(28px + env(safe-area-inset-bottom, 0px)); color: var(--ink-2); font-size: 14px; }
footer .updated { margin: 0 0 16px; font-size: 13px; color: var(--ink-2); }
footer h4 { margin: 0 0 6px; color: var(--ink); font-size: 15px; }
.cta { display: inline-block; margin: 10px 0 18px; border: 0; background: var(--accent); color: #fff; text-decoration: none; border-radius: 999px; padding: 10px 18px; font-weight: 650; }

/* submit-an-event form */
.form h2 { margin: 6px 0 2px; }
.form .lede { color: var(--ink-2); font-size: 14.5px; margin: 0 0 14px; }
.form label { display: block; font-size: 13.5px; font-weight: 650; margin: 12px 0 5px; }
.form label small { font-weight: 500; color: var(--ink-2); }
.form input, .form select, .form textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
.form textarea { min-height: 90px; resize: vertical; }
.form input:focus, .form select:focus, .form textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form .row2 label { margin-top: 12px; }
.form .err { color: var(--accent); font-size: 13.5px; margin: 6px 0 0; min-height: 1em; }
.form [aria-invalid="true"] { border-color: var(--accent); }
.form .send { width: 100%; margin-top: 16px; border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 700; }
.form .send:disabled { opacity: .6; }
.form .fine { color: var(--ink-2); font-size: 12.5px; margin: 10px 0 0; text-align: center; }
.form .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.thanks { text-align: center; padding: 18px 4px 6px; }
.thanks .big { font-size: 40px; line-height: 1; }
.thanks p { color: var(--ink-2); margin: 8px 0 18px; }
.thanks .actions { grid-template-columns: 1fr 1fr; }

/* detail sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,20,20,.45); z-index: 40; }
.sheet { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); max-width: 640px; margin: 0 auto; }
@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; transform: translateY(-50%); border-radius: 20px; max-height: 84vh; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet img.hero { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: var(--surface-2); }
.sheet h2 { margin: 6px 0 4px; font-size: 22px; line-height: 1.25; }
.sheet .credit { margin: -6px 0 8px; font-size: 11.5px; color: var(--ink-2); }
.sheet .credit a { color: inherit; }
.sheet .row { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; color: var(--ink); }
.sheet .row svg { flex: none; color: var(--ink-2); margin-top: 2px; }
.sheet p.desc { color: var(--ink); margin: 0; white-space: pre-line; }
.about { margin: 18px 0 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.about h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--ink-2); letter-spacing: .01em; }

<script>
// Bump this whenever the page changes, so open apps notice and reload themselves.
const APP_VERSION = "2026-11-21.4";

// "Submit an event" sends answers to this Google Form; they land in a Google Sheet for approval.
// The numbers are the form's question IDs, in the form's question order.
const SUBMIT_FORM = "https://docs.google.com/forms/d/e/1FAIpQLSfapK0EVXXUSMnXeXZ7tVsfPyvdC3B3DPv44BCvGLJpqKdv5g/formResponse";
const SUBMIT_FIELDS = {
  name: "entry.1947685435", date: "entry.1436712317", start: "entry.1497677929", end: "entry.222007628",
  venue: "entry.1081429117", address: "entry.811791712", price: "entry.1586951292", category: "entry.1671384174",
  link: "entry.894822772", description: "entry.1861025068",
  photo: "entry.1982639986",  // "Photo or Flyer" (optional)
};

// Visitor counts: the site code from goatcounter.com (for https://CODE.goatcounter.com/count).
// Empty = off. Only someone signed in to that GoatCounter account can see the numbers.
const GOATCOUNTER = "bontemps";

// The public site (event pages for sharing live under it)
const SITE = "https://brody-robicheaux.github.io/bon-temps/";
const homeScreenApp = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const isListed = e => !!(state.data && state.data.events.some(x => x.id === e.id));

const CATS = {
  music: "Music", theater: "Theater", food: "Food & Drink", arts: "Arts & Culture",
  wellness: "Wellness", family: "Family", sports: "Sports", civic: "Civic", community: "Community",
};
// The strip: three ranges, then one tile per day for the next two weeks ("d:2026-11-21")
const WHEN = { picks: "Top picks", tonight: "Tonight", weekend: "Weekend" };
const PICKS = 10;  // how many events "Top picks" shows (from the next 7 days)
const TODAY_PICKS = 4;  // how many of them can be today's (today's best come first)
const STRIP_DAYS = 14;
// (runs while the page is starting up, so it only uses function declarations)
function validWhen(w) { return !!WHEN[w] || (/^d:\d{4}-\d{2}-\d{2}$/.test(w || "") && w.slice(2) >= iso10(lafNow())); }
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const PAGE = 120;

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("bt-" + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("bt-" + k, JSON.stringify(v)); } catch (_) {} },
};

const state = {
  data: null, lastFetch: 0, q: "",
  when: pickWhen(), cats: new Set(store.get("cats", [])),
  free: false, saved: false, venue: null, shown: PAGE,
};
// A shared link opens on the same view: ?when=2026-11-21&cat=music,food&free=1&q=zydeco
// (when: a date, tonight, weekend or picks). Old dates fall back to the usual default.
const linked = new URLSearchParams(location.search);
if (linked.has("when") || linked.has("cat") || linked.has("free") || linked.has("q")) {
  const w = linked.get("when") || "";
  const key = /^\d{4}-\d{2}-\d{2}$/.test(w) ? "d:" + w : w;
  if (validWhen(key)) state.when = key;
  if (linked.has("cat")) state.cats = new Set(linked.get("cat").split(",").filter(c => CATS[c]));
  state.free = linked.get("free") === "1";
  state.q = (linked.get("q") || "").trim().toLowerCase();
}
// Keep the address bar matching what's on screen, so copying or sharing it shares this view
function viewParams() {
  const p = new URLSearchParams();
  if (!state.saved && !state.venue) {
    p.set("when", state.when.startsWith("d:") ? state.when.slice(2) : state.when);
    if (state.cats.size) p.set("cat", [...state.cats].join(","));
    if (state.free) p.set("free", "1");
    if (state.q) p.set("q", state.q);
  }
  return p;
}
function syncUrl() {
  if (!$("sheet").hidden) return;  // the open event owns the #hash for now
  const p = viewParams().toString().replace(/%2C/g, ",");
  history.replaceState(null, "", location.pathname + (p ? "?" + p : "") + location.hash);
}
function viewTitle() {
  const day = state.when.startsWith("d:") ? parse(state.when.slice(2)) : null;
  const when = day ? `${DOW[day.getDay()]}, ${MON[day.getMonth()]} ${day.getDate()}` : WHEN[state.when];
  const cats = [...state.cats].map(c => CATS[c]).join(" + ");
  return `${cats ? cats + " · " : ""}${state.free ? "Free · " : ""}${when}${state.q ? ` · “${state.q}”` : ""} in Lafayette`;
}
async function shareView() {
  // A single day shares its day page (docs/d/<date>.html), whose link preview reads
  // "Saturday, Nov 21 in Lafayette · 42 events"; other views share the regular address.
  const p = viewParams(), day = state.when.startsWith("d:") && state.when.slice(2);
  if (day) p.delete("when");
  const q = p.toString().replace(/%2C/g, ",");
  const url = day ? `${SITE}d/${day}${q ? "?" + q : ""}` : location.origin + location.pathname + "?" + q;
  const title = viewTitle();
  try {
    if (navigator.share) await navigator.share({ title: "Bon Temps", text: title, url });
    else { await navigator.clipboard.writeText(`${title}\n${url}`); toast("Link copied"); }
  } catch (_) {}
}
// Saved events are kept on this device as full copies, so they survive refreshes, time away,
// and an event dropping off its source. They're cleared a day after the event is over.
const savedEvents = store.get("savedEvents", {});
const saved = new Set([...store.get("saved", []), ...Object.keys(savedEvents)]);

// Opens on Top picks. A choice made during this visit sticks until the tab is closed.
function pickWhen() {
  let chosen = null;
  try { chosen = sessionStorage.getItem("bt-when"); } catch (_) {}
  if (validWhen(chosen)) return chosen;
  return "picks";
}
function rememberWhen(w) { try { sessionStorage.setItem("bt-when", w); } catch (_) {} }
function persistSaved() { store.set("saved", [...saved]); store.set("savedEvents", savedEvents); }
const findEvent = id => (state.data && state.data.events.find(x => x.id === id)) || savedEvents[id];
function syncSaved() {
  const byId = new Map(state.data.events.map(e => [e.id, e]));
  const cutoff = addDays(dayStart(lafNow()), -1);
  for (const id of [...saved]) {
    if (byId.has(id)) savedEvents[id] = byId.get(id);  // freshest details
    const e = savedEvents[id];
    if (!e || (parse(e.end) || parse(e.start)) < cutoff) { saved.delete(id); delete savedEvents[id]; }
  }
  persistSaved();
}

// ---------- dates (events are stored in Lafayette local time) ----------
const parse = s => {
  if (!s) return null;
  const [d, t = "00:00"] = s.split("T");
  const [y, m, day] = d.split("-").map(Number); const [h, mi] = t.split(":").map(Number);
  return new Date(y, m - 1, day, h, mi);
};
// "now" in Lafayette, expressed the same way, so filters work wherever the viewer is
function lafNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return new Date(+p.year, p.month - 1, +p.day, +p.hour, +p.minute);
}
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtTime = d => { let h = d.getHours(), m = d.getMinutes(); const ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; return m ? `${h}:${String(m).padStart(2, "0")} ${ap}` : `${h} ${ap}`; };
const fmtDate = d => `${DOW[d.getDay()].slice(0, 3)}, ${MON[d.getMonth()]} ${d.getDate()}`;

function range(key) {
  const now = lafNow(), t0 = dayStart(now);
  switch (key) {
    case "today": return [t0, addDays(t0, 1)];
    case "tonight": return [new Date(new Date(t0).setHours(17)), new Date(addDays(t0, 1).setHours(3))];
    case "weekend": {
      const dow = t0.getDay(); // Fri 5pm → Sun night
      let fri = addDays(t0, (5 - dow + 7) % 7); if (dow === 6) fri = addDays(t0, -1); if (dow === 0) fri = addDays(t0, -2);
      const s = new Date(fri); s.setHours(17);
      return [t0 > s ? t0 : s, addDays(fri, 3)];
    }
    case "picks": return [now, addDays(t0, 8)];
    case "all": return [t0, addDays(t0, 400)];
    default: {
      if (key && key.startsWith("d:")) {  // one whole day, so today's earlier events stay until midnight
        const d = parse(key.slice(2));
        return [d, addDays(d, 1)];
      }
      return [t0, addDays(t0, 31)];
    }
  }
}

// ---------- holidays ----------
// Major U.S. holidays (plus Mardi Gras, this is Lafayette), worked out for any year.
function nthWeekday(y, m, weekday, n) {  // n = 1..4, or -1 for the last one
  if (n > 0) { const d = new Date(y, m, 1); d.setDate(1 + (weekday - d.getDay() + 7) % 7 + (n - 1) * 7); return d; }
  const d = new Date(y, m + 1, 0); d.setDate(d.getDate() - (d.getDay() - weekday + 7) % 7); return d;
}
function easter(y) {  // Gregorian computus

  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);

}
const HOLIDAYS = {};
function holidayOn(d) {
  const y = d.getFullYear();
  if (!HOLIDAYS[y]) {
    const list = [
      [new Date(y, 0, 1), "🎆", "New Year's Day"],
      [nthWeekday(y, 0, 1, 3), "🕊️", "Martin Luther King Jr. Day"],
      [new Date(y, 1, 14), "❤️", "Valentine's Day"],
      [addDays(easter(y), -47), "⚜️", "Mardi Gras"],
      [new Date(y, 2, 17), "☘️", "St. Patrick's Day"],
      [easter(y), "🐣", "Easter"],
      [nthWeekday(y, 4, 0, 2), "💐", "Mother's Day"],
      [nthWeekday(y, 4, 1, -1), "🇺🇸", "Memorial Day"],
      [nthWeekday(y, 5, 0, 3), "👔", "Father's Day"],
      [new Date(y, 5, 19), "✊🏾", "Juneteenth"],
      [new Date(y, 6, 4), "🎆", "Independence Day"],
      [nthWeekday(y, 8, 1, 1), "🛠️", "Labor Day"],
      [new Date(y, 9, 31), "🎃", "Halloween"],
      [new Date(y, 10, 11), "🎖️", "Veterans Day"],
      [nthWeekday(y, 10, 4, 4), "🦃", "Thanksgiving"],
      [new Date(y, 11, 24), "🎄", "Christmas Eve"],
      [new Date(y, 11, 25), "🎄", "Christmas"],
      [new Date(y, 11, 31), "🥂", "New Year's Eve"],
    ];
    HOLIDAYS[y] = Object.fromEntries(list.map(([date, emoji, name]) => [iso10(date), { emoji, name }]));
  }

}

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const catColor = c => `var(--${c})`;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now"; if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60); if (h < 24) return `${h} hr ago`;

// Search ignores accents and curly quotes ("noel" finds "Noël", "cite" finds "Cité") and

const fold = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[’‘]/g, "'");
const searchText = new WeakMap();
const matches = (e, q) => {
  if (!q) return true;
  let text = searchText.get(e);
  if (!text) searchText.set(e, text = fold(`${e.title} ${e.venue} ${e.desc} ${e.address} ${e.source} ${(e.cats || []).map(c => CATS[c]).join(" ")}`));

};

// ---------- data ----------
async function load({ manual = false } = {}) {
  const btn = $("refresh"); btn.classList.add("spin");
  try {
    const res = await fetch(`events.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const before = state.data ? new Set(state.data.events.map(e => e.id)) : null;
    state.data = data; state.lastFetch = Date.now();

    if (before) {
      const fresh = data.events.filter(e => !before.has(e.id)).length;
      if (manual || fresh) toast(fresh ? `${fresh} new event${fresh > 1 ? "s" : ""} added` : `Up to date · updated ${ago(data.updated)}`);

    toast(navigator.onLine ? "Couldn't load events. Try again." : "You're offline");

}
function updatedLabel() { $("updated").textContent = state.data ? `Events updated ${ago(state.data.updated)}. New ones are added every couple of hours.` : ""; }

// ---------- venues ----------
// "Blue Moon Saloon and Guest House", "Blue Moon Saloon" -> "bluemoonsaloon"; "Rock'n'Bowl® de Lafayette" -> "rocknbowl"
const VENUE_STOP = new Set(["the", "and", "guest", "house", "de", "la", "lafayette", "center", "centre", "for", "arts", "performing", "of", "at"]);
function venueKey(v) {
  if (!v) return "";
  const first = v.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().split(/ - | \| |,| @ |\[/)[0];
  const key = first.split(/\s+/).filter(w => !VENUE_STOP.has(w.replace(/[^a-z0-9]/g, ""))).join("").replace(/[^a-z0-9]/g, "");
  return key.length >= 4 ? key : "";
}
function venueEvents(key) {
  const now = lafNow();
  return state.data.events.filter(e => venueKey(e.venue) === key && (parse(e.end) || parse(e.start)) >= dayStart(now));
}
function openVenue(key, name) {
  closeSheet();
  state.venue = { key, name }; state.saved = false; state.shown = PAGE;
  scrollTo(0, 0); render();
}

// ---------- render ----------
function filtered() {
  if (state.venue) return venueEvents(state.venue.key);
  // Searching looks through every upcoming event, whichever day or tab is selected
  const [a, b] = state.saved || searching() ? range("all") : range(state.when);
  const pool = state.saved ? Object.values(savedEvents).sort((x, y) => x.start.localeCompare(y.start)) : state.data.events;
  const list = pool.filter(e => passes(e) && inWindow(e, a, b));
  if (state.when !== "picks" || state.saved || searching()) return list;
  return rankPicks(list);
}
// Top picks: the best-scoring events of the week, shown in date order
function rankPicks(list) {
  // A weekly regular repeats over 2+ weeks (Cajun Jam); a play's 3-night run doesn't count
  const dates = {};
  for (const e of state.data.events) (dates[titleRoot(e)] ||= []).push(parse(e.start));
  const repeats = {};
  for (const [t, ds] of Object.entries(dates)) repeats[t] = ds.length >= 3 && (Math.max(...ds) - Math.min(...ds)) >= 13 * 864e5 ? ds.length : 0;
  // Only events with a real sign of being a big deal can be picked (see bigDeal); on a quiet
  // week that means fewer than PICKS
  const ranked = list.filter(e => !e.ongoing && bigDeal(e, repeats)).map(e => [e, pickScore(e, repeats)]).sort((x, y) => y[1] - x[1]);
  // Today's best come first (up to TODAY_PICKS), then the rest of the week, at most 2 a day and
  // one per show so the list covers several days. Shown in order of day and time.
  const today = iso10(lafNow());
  const picks = [], perDay = {}, seen = new Set();
  const take = (e, cap) => {
    const day = e.start.slice(0, 10) < today ? today : e.start.slice(0, 10), root = titleRoot(e);
    if ((perDay[day] || 0) >= cap || seen.has(root) || picks.length >= PICKS) return;
    perDay[day] = (perDay[day] || 0) + 1; seen.add(root); picks.push(e);
  };
  for (const [e] of ranked) if (e.start.slice(0, 10) <= today) take(e, TODAY_PICKS);
  for (const [e] of ranked) if (e.start.slice(0, 10) > today) take(e, 2);
  // Shows that began earlier and are still running sort with today
  const at = e => e.start.slice(0, 10) < today ? today + "T00:00" : e.start;
  return picks.sort((x, y) => at(x).localeCompare(at(y)));
}

// There's no public "how many people are going" data, so picks rest on outside signs that an
// event is a big deal: local listing sites featuring it as trending ("hot", from the collector),
// a ticketed show at a major venue, a festival or parade, a Ragin' Cajuns home game, or many
// separate sites listing it. Without one of those an event never makes Top picks.
const BIG_VENUES = /heymann|cajundome|lourdes stadium|acadiana center|blue moon|moncus|vermilionville|cit[eé] des arts|rock.?n.?bowl|wonderland|feed n seed|club 337|hideaway/i;
const BIG_WORDS = /festival|\bfest\b|parade|mardi gras|courir|no[eë]l acadien|downtown alive|bach lunch|gala|championships?|symphony|orchestra|ballet|nutcracker|tribute to|live in concert|candlelight/i;
const SMALL_WORDS = /\b(?:talk|lecture|class|workshop|round ?up|yoga|tai chi|book club|trivia|karaoke|open mic|meet ?up|tour with|pop-?up|food drive|drive|sale|market|registration|job fair|storytime|crafts?)\b/i;
function bigDeal(e, repeats) {
  if (e.pick) return true;   // on the "always in Top picks" list (collector/sources.json topPicks)
  if (SMALL_WORDS.test(e.title) && !e.hot && !BIG_WORDS.test(e.title)) return false;
  if ((repeats[titleRoot(e)] || 0) >= 3 && !homeGame(e)) return false;   // weekly regulars

  const cardHtml = e => {

function render() {
  if (!state.data) return;
  renderChips();
  const list = filtered();
  const ongoing = list.filter(e => e.ongoing), dated = list.filter(e => !e.ongoing);
  let h = state.saved ? `<div class="savedbar">♥ Saved events (${saved.size})<button type="button" data-saved>Back to all</button></div>` : "";
  if (state.venue) h = `<div class="venuebar"><div><b>${esc(state.venue.name)}</b><small>${list.length} upcoming event${list.length === 1 ? "" : "s"}</small></div><button type="button" data-allvenues>Back to all</button></div>`;
  else if (searching()) h += `<div class="savedbar searchbar">🔍 ${list.length} match${list.length === 1 ? "" : "es"} in all upcoming events<button type="button" data-clearq>Clear</button></div>`;
  else if (!state.saved) h += tipHtml() + picksRow();
  if (!list.length) {
    h += `<div class="empty">${state.venue ? "Nothing coming up here right now." : state.saved ? "Nothing saved yet. Tap ♥ on an event to keep it here." : state.q ? `No events match “${esc(state.q)}”.` : state.when.startsWith("d:") ? (holidayOn(parse(state.when.slice(2))) ? `Happy ${holidayOn(parse(state.when.slice(2))).name}! Nothing's listed for this day yet. Try another day or Top picks.` : "Nothing listed for this day yet. Try another day or Top picks.") : "No events in this window. Try Top picks."}</div>`;

      const s = parse(e.start), started = s < dayStart(from) || (s < from && +dayStart(s) !== +dayStart(from)), d = dayStart(started ? from : s);

      }

  $("main").innerHTML = h;

  syncUrl();
}


// ---------- detail sheet ----------
function calLinks(e) {
  const pad = n => String(n).padStart(2, "0");
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const t = d => `${f(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const s = parse(e.start);
  const en = parse(e.end) || new Date(+s + 2 * 3600e3);
  const dates = e.allDay ? `${f(s)}/${f(addDays(s, 1))}` : `${t(s)}/${t(en)}`;
  const g = "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: e.title, dates, ctz: "America/Chicago", location: [e.venue, e.address].filter(Boolean).join(", "), details: `${e.desc}\n\n${e.url}` });
  const icsEsc = x => String(x || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bon Temps//EN", "BEGIN:VEVENT", `UID:${e.id}@bontemps`, `DTSTAMP:${t(new Date())}`,
    e.allDay ? `DTSTART;VALUE=DATE:${f(s)}` : `DTSTART;TZID=America/Chicago:${t(s)}`,
    e.allDay ? `DTEND;VALUE=DATE:${f(addDays(s, 1))}` : `DTEND;TZID=America/Chicago:${t(en)}`,
    `SUMMARY:${icsEsc(e.title)}`, `LOCATION:${icsEsc([e.venue, e.address].filter(Boolean).join(", "))}`, `DESCRIPTION:${icsEsc(e.desc + "\n" + e.url)}`, `URL:${e.url}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  // iPhones only offer "Add to Calendar" for a real .ics web address, so events on the list use
  // the file the collector writes (docs/cal/<id>.ics). A saved event that has since dropped
  // off the list falls back to a file built here.
  // The Home Screen app opens links on its own domain inside its bare window, which can't open
  // calendar files (blank white page). There the button uses an "x-safari-https://" link, which
  // iPhones (iOS 17+) open in real Safari, and Safari offers "Add to Calendar".
  const listed = isListed(e);
  const file = homeScreenApp() ? `x-safari-${SITE}cal/${e.id}.ics` : `cal/${e.id}.ics`;
  return { google: g, ics: listed ? file : URL.createObjectURL(new Blob([ics], { type: "text/calendar" })) };
}

      <label for="f-venue">Venue</label>
      <input id="f-venue" name="venue" required maxlength="120" placeholder="Blue Moon Saloon">
      <label for="f-address">Address <small>(optional)</small></label>
      <input id="f-address" name="address" maxlength="160" placeholder="215 E Convent St, Lafayette">
      <div class="row2">
        <div><label for="f-price">Price <small>(optional)</small></label><input id="f-price" name="price" maxlength="60" placeholder="Free, $10"></div>
        <div><label for="f-cat">Category</label><select id="f-cat" name="category">${opts}</select></div>
      </div>
      <label for="f-link">Link <small>(tickets, Instagram post or website)</small></label>
      <input id="f-link" name="link" type="url" inputmode="url" maxlength="300" placeholder="https://">
      ${SUBMIT_FIELDS.photo ? `<label for="f-photo">Photo or flyer <small>(optional: link to the image, or to a page that shows it)</small></label>
      <input id="f-photo" name="photo" type="url" inputmode="url" maxlength="500" placeholder="https://">` : ""}
      <label for="f-desc">Description <small>(optional)</small></label>
      <textarea id="f-desc" name="description" maxlength="1500" placeholder="A sentence or two about the event"></textarea>
      <div class="hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="err" id="f-err" role="alert"></p>
      <button class="send" type="submit" id="f-send">Submit event</button>
      <p class="fine">No account needed. Events usually appear within a few hours of being approved.</p>
    </form>`;
  showSheet("#submit");
  $("subform").addEventListener("submit", sendSubmission);
  $("subform").addEventListener("input", ev => { ev.target.removeAttribute("aria-invalid"); $("f-err").textContent = ""; });
  $("f-name").focus();
}

// Corrections go to the same Google Form as submissions, marked "Correction", so they show up
// in the sheet (and its email notifications). They are never published.
function openFix(e) {
  $("fix").innerHTML = `<form class="fixform" id="fixform"><label for="fix-note"><b>What's wrong?</b> Wrong time, venue, cancelled, duplicate…</label>
    <textarea id="fix-note" maxlength="1000" required placeholder="It starts at 8, not 7. It's at the Blue Moon, not downtown."></textarea>
    <div class="row"><button type="button" id="fix-cancel">Cancel</button><button type="submit" class="go" id="fix-send">Send</button></div></form>`;
  $("fix-note").focus();
  $("fix-cancel").onclick = () => { $("fix").innerHTML = `<button type="button" id="fixbtn">Something wrong with this listing?</button>`; $("fixbtn").onclick = () => openFix(e); };
  $("fixform").onsubmit = async ev => {
    ev.preventDefault();
    const note = $("fix-note").value.trim();
    if (!note) return $("fix-note").focus();
    $("fix-send").disabled = true; $("fix-send").textContent = "Sending…";
    const v = { name: `Correction: ${e.title}`.slice(0, 140), date: e.start.slice(0, 10), start: e.allDay ? "" : e.start.slice(11, 16),
      venue: e.venue || "-", address: e.address, category: "Correction", link: location.origin + location.pathname + "#" + e.id,
      description: `${note}\n\n(Listing from ${e.source}. Event id ${e.id}.)` };
    const body = new URLSearchParams();
    for (const [k, id] of Object.entries(SUBMIT_FIELDS)) if (id) body.append(id, v[k] || "-");
    try {
      await fetch(SUBMIT_FORM, { method: "POST", mode: "no-cors", body });
      $("fix").innerHTML = `<p class="fine">Thanks! We'll take a look and fix it.</p>`;
    } catch (_) {
      $("fix-send").disabled = false; $("fix-send").textContent = "Send";
      toast(navigator.onLine ? "Couldn't send that. Try again." : "You're offline");
    }
  };
}

function iso10(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

async function sendSubmission(ev) {
  ev.preventDefault();
  const f = ev.target, v = Object.fromEntries(new FormData(f));
  for (const k in v) v[k] = String(v[k]).trim();
  const bad = [];
  if (!v.name) bad.push(["f-name", "Add the event's name."]);
  if (!v.date) bad.push(["f-date", "Pick the date."]);
  else if (v.date < iso10(lafNow())) bad.push(["f-date", "That date has already passed."]);
  if (!v.venue) bad.push(["f-venue", "Add where it's happening."]);
  if (v.photo && !/^https?:\/\/\S+\.\S+/i.test(v.photo)) {
    if (/^\S+\.\S+$/.test(v.photo)) v.photo = "https://" + v.photo; else bad.push(["f-photo", "That photo link doesn't look right. Long-press the image and choose Copy, or copy the page's address."]);
  }
  if (v.link && !/^https?:\/\/\S+\.\S+/i.test(v.link)) {
    if (/^\S+\.\S+$/.test(v.link)) v.link = "https://" + v.link; else bad.push(["f-link", "That link doesn't look right. Copy it from your browser's address bar."]);
  }
  if (bad.length) {
    bad.forEach(([id]) => $(id).setAttribute("aria-invalid", "true"));
    $("f-err").textContent = bad[0][1];
    $(bad[0][0]).focus();
    return;
  }
  const btn = $("f-send"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    if (!v.website) {  // the hidden field is only ever filled in by spam bots
      const body = new URLSearchParams();
      // Blank answers go as "-": if a question is ever set to "Required" in the Google Form,
      // an empty answer would make Google silently reject the whole submission.
      for (const [k, id] of Object.entries(SUBMIT_FIELDS)) if (id) body.append(id, v[k] || "-");
      await fetch(SUBMIT_FORM, { method: "POST", mode: "no-cors", body });
    }
    $("sheet").innerHTML = `<div class="grab"></div><button class="close" type="button" id="close" aria-label="Close">×</button>
      <div class="thanks"><div class="big">🎉</div><h2 id="sheet-title">Thanks, it's in</h2>
      <p>We'll review “${esc(v.name)}” and it'll show up on Bon Temps once it's approved.</p>
      <div class="actions"><button type="button" id="again">Submit another</button><button type="button" class="primary" id="done" style="grid-column:auto">Done</button></div></div>`;
    $("close").onclick = closeSheet; $("done").onclick = closeSheet; $("again").onclick = openSubmit;
  } catch (_) {
    btn.disabled = false; btn.textContent = "Submit event";
    $("f-err").textContent = navigator.onLine ? "Couldn't send that. Try again in a moment." : "You're offline. Connect and try again.";
  }
}

function showSheet(hash) {
  $("scrim").hidden = false; $("sheet").hidden = false; $("sheet").scrollTop = 0;
  document.body.style.overflow = "hidden";
  history.replaceState(null, "", hash);
  $("close").onclick = closeSheet;
}

// "Blue Moon Saloon" for a venue's own feed, the listing site's name otherwise
const sourceSite = e => e.source.replace(/\s*\(.*\)$/, "");
function closeSheet() {
  $("scrim").hidden = true; $("sheet").hidden = true; document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
  syncUrl();
}

function toggleSave(id) {
  if (saved.has(id)) { saved.delete(id); delete savedEvents[id]; toast("Removed from saved"); }
  else {
    const e = findEvent(id); if (!e) return;
    saved.add(id); savedEvents[id] = e; toast("Saved on this device");
    try { navigator.storage?.persist?.(); } catch (_) {}  // ask the browser not to clear it
  }
  persistSaved();
  document.querySelectorAll(`[data-save="${id}"]`).forEach(b => {
    const on = saved.has(id); b.setAttribute("aria-pressed", on);
    if (b.classList.contains("save")) b.innerHTML = heart(on); else b.textContent = on ? "♥ Saved" : "♡ Save";
  });
  renderChips();
  if (state.saved) render();
}

// ---------- night mode ----------
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light")) === "dark";
function paintThemeButton() {
  const dark = isDark();
  $("themebtn").setAttribute("aria-label", dark ? "Switch to day mode" : "Switch to night mode");
  $("themebtn").innerHTML = dark
    ? `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = dark ? "#0F1726" : "#FAF8F3");
}
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("theme", next);
  paintThemeButton();
}
darkQuery.addEventListener?.("change", paintThemeButton);
paintThemeButton();

// ---------- events ----------
function syncHead() { document.documentElement.style.setProperty("--head-h", $("top").offsetHeight + "px"); }
addEventListener("resize", syncHead);

document.addEventListener("click", ev => {
  const t = ev.target.closest("button, .card, a"); if (!t) return;
  if (t.dataset.save) { ev.stopPropagation(); return toggleSave(t.dataset.save); }
  if (t.dataset.when) { clearSearch(); state.when = t.dataset.when; state.shown = PAGE; rememberWhen(state.when); return render(); }
  if ("clearq" in t.dataset) { clearSearch(); state.shown = PAGE; return render(); }
  if ("saved" in t.dataset || t.id === "savedbtn") { state.saved = !state.saved; state.venue = null; state.shown = PAGE; scrollTo(0, 0); return render(); }
  if (t.dataset.venue) return openVenue(t.dataset.venue, t.dataset.venuename);
  if ("allvenues" in t.dataset) { state.venue = null; state.shown = PAGE; scrollTo(0, 0); return render(); }
  if ("tipclose" in t.dataset) { store.set("tipDismissed", true); $("tip")?.remove(); return; }
  if ("install" in t.dataset && installPrompt) { installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; $("tip")?.remove(); }); return; }
  if ("cat" in t.dataset) { const c = t.dataset.cat; if (!c) state.cats.clear(); else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c); store.set("cats", [...state.cats]); state.shown = PAGE; return render(); }
  if ("free" in t.dataset) { state.free = !state.free; return render(); }
  if (t.id === "more") { state.shown += PAGE; return render(); }
  if (t.id === "sharelist") return shareView();
  if (t.id === "refresh") return load({ manual: true });
  if (t.id === "themebtn") return toggleTheme();
  if (t.id === "submit") return openSubmit();
  if (t.id === "readmore") { const d = $("desc"); const open = d.classList.toggle("open"); t.textContent = open ? "Show less" : "Read more"; return; }
  if (t.classList.contains("card")) return openSheet(t.dataset.id);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("sheet").hidden) closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList?.contains("card")) { ev.preventDefault(); openSheet(ev.target.dataset.id); }
});
$("scrim").addEventListener("click", closeSheet);

// Swipe left/right on the list to move through the strip (Top picks, Tonight, Weekend, then each day)
let touch = null;
$("main").addEventListener("touchstart", ev => {
  const t = ev.touches[0];
  touch = ev.touches.length === 1 ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
}, { passive: true });
$("main").addEventListener("touchend", ev => {
  if (!touch || !state.data || state.saved || state.venue || searching() || !$("sheet").hidden) return (touch = null);
  const t = ev.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y, quick = Date.now() - touch.at < 700;
  touch = null;
  if (!quick || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
  const keys = [...$("when").querySelectorAll("[data-when]")].map(b => b.dataset.when);
  const next = keys[keys.indexOf(state.when) + (dx < 0 ? 1 : -1)];
  if (!next) return;
  state.when = next; state.shown = PAGE; rememberWhen(next);
  render();
  const m = $("main"); m.classList.remove("slide-l", "slide-r"); void m.offsetWidth; m.classList.add(dx < 0 ? "slide-l" : "slide-r");
  scrollTo({ top: 0 });
}, { passive: true });
function clearSearch() { state.q = ""; $("q").value = ""; }
if (state.q) $("q").value = state.q;
let qt; $("q").addEventListener("input", ev => { clearTimeout(qt); qt = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); state.shown = PAGE; render(); }, 120); });

// Phones (especially Home Screen apps) keep an old copy of this page for a while. Ask the
// server for the newest one, skipping every cache, and reload if its version is newer.
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (Date.now() - lastUpdateCheck < 60e3) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch(`${location.pathname}?update-check=${Date.now()}`, { cache: "no-store" });
    const latest = (await res.text()).match(/const APP_VERSION = "([^"]+)"/)?.[1];
    if (!latest || latest === APP_VERSION) return;
    let tried = null; try { tried = sessionStorage.getItem("bt-updated-to"); } catch (_) {}
    if (tried === latest) return;  // already reloaded for this version once; don't loop
    try { sessionStorage.setItem("bt-updated-to", latest); } catch (_) {}
    const q = new URLSearchParams(location.search); q.set("v", latest);
    location.replace(`${location.pathname}?${q}${location.hash}`);
  } catch (_) {}
}
checkForUpdate();

// Keep it fresh: check again when the page comes back into view, and every 10 minutes while open.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  checkForUpdate();
  if (Date.now() - state.lastFetch > 5 * 60e3) load();
});
setInterval(() => { if (!document.hidden) load(); }, 10 * 60e3);
setInterval(updatedLabel, 60e3);

// Visitor counts (private to the GoatCounter account). Counts page views only: no cookies,
// no personal data, and every view is counted as "/" so filters and events don't split the numbers.
if (GOATCOUNTER && !/^(localhost|127\.|\[::1\])/.test(location.hostname)) {
  window.goatcounter = { path: () => "/" };
  const gc = document.createElement("script");
  gc.async = true; gc.src = "https://gc.zgo.at/count.js";
  gc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  document.head.appendChild(gc);
}

// bontemps/#submit opens the form directly, handy for sending to venues and bands
if (location.hash === "#submit") openSubmit();
load().then(() => {
  if (state.data && !state.saved && !filtered().length) { state.when = "picks"; render(); }  // nothing left today/tonight
  const id = location.hash.slice(1); if (id && id !== "submit" && state.data) openSheet(id);
});
</script>
