name: Collect events

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (GitHub may run it a few minutes late)
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab
    inputs:
      only:
        description: "Test one source by name (leave empty to check everything)"
        required: false
        default: ""

permissions:
  contents: write   # save the new events.json
  issues: write     # open the "Big events missing dates" reminder

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect events
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python collector/collect.py "${{ inputs.only }}"
      - name: Save if anything changed
        run: |
          git config user.name "bon-temps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json collector/detail-cache.json
          git add -A docs/cal docs/e docs/d
          git add collector/lafayette-travel-cache.json collector/health.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update events"
          git pull --rebase
          git push
